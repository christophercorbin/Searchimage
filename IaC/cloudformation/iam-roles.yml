AWSTemplateFormatVersion: '2010-09-09'
Description: 'IAM Roles for DME Searcher - GitHub OIDC, ECS Task Execution, and Application'

Parameters:
  GitHubOrg:
    Type: String
    Default: christophercorbin
    Description: GitHub organization name

  GitHubRepo:
    Type: String
    Default: Searchimage
    Description: GitHub repository name

Resources:
  # =========================================================================
  # GitHub OIDC Identity Provider
  # =========================================================================
  GitHubOIDCProvider:
    Type: AWS::IAM::OpenIDConnectProvider
    Properties:
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1  # GitHub OIDC thumbprint
      Url: https://token.actions.githubusercontent.com

  # =========================================================================
  # GitHub Actions ECR Push Role
  # =========================================================================
  GitHubActionsECRRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: github-actions-ecr-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub 'arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
            Action: 'sts:AssumeRoleWithWebIdentity'
            Condition:
              StringEquals:
                'token.actions.githubusercontent.com:aud': 'sts.amazonaws.com'
              StringLike:
                'token.actions.githubusercontent.com:sub': !Sub 'repo:${GitHubOrg}/${GitHubRepo}:*'
      Tags:
        - Key: Purpose
          Value: GitHubActionsECRPush

  GitHubActionsECRPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: github-actions-ecr-policy
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: ECRGetAuthorizationToken
            Effect: Allow
            Action:
              - ecr:GetAuthorizationToken
            Resource: '*'
          - Sid: ECRPushImages
            Effect: Allow
            Action:
              - ecr:BatchCheckLayerAvailability
              - ecr:GetDownloadUrlForLayer
              - ecr:PutImage
              - ecr:InitiateLayerUpload
              - ecr:UploadLayerPart
              - ecr:CompleteLayerUpload
              - ecr:DescribeRepositories
              - ecr:DescribeImages
            Resource:
              - !Sub 'arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/searcher-dev'
              - !Sub 'arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/searcher-stage'
              - !Sub 'arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/searcher-main'
      Roles:
        - !Ref GitHubActionsECRRole

  # =========================================================================
  # GitHub Actions ECS Deploy Role
  # =========================================================================
  GitHubActionsECSDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: github-actions-ecs-deploy-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub 'arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
            Action: 'sts:AssumeRoleWithWebIdentity'
            Condition:
              StringEquals:
                'token.actions.githubusercontent.com:aud': 'sts.amazonaws.com'
              StringLike:
                'token.actions.githubusercontent.com:sub': !Sub 'repo:${GitHubOrg}/${GitHubRepo}:*'
      Tags:
        - Key: Purpose
          Value: GitHubActionsECSDeploy

  GitHubActionsECSDeployPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: github-actions-ecs-deploy-policy
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: ECSDescribeTasks
            Effect: Allow
            Action:
              - ecs:DescribeTaskDefinition
              - ecs:DescribeServices
              - ecs:DescribeClusters
            Resource: '*'
          - Sid: ECSRegisterTaskDefinition
            Effect: Allow
            Action:
              - ecs:RegisterTaskDefinition
            Resource: !Sub 'arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/dme-searcher-*:*'
          - Sid: ECSUpdateService
            Effect: Allow
            Action:
              - ecs:UpdateService
            Resource:
              - !Sub 'arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:service/dme-cluster/dme-searcher-dev'
              - !Sub 'arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:service/dme-cluster/dme-searcher-stage'
              - !Sub 'arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:service/dme-cluster/dme-searcher-prod'
          - Sid: IAMPassRole
            Effect: Allow
            Action:
              - iam:PassRole
            Resource:
              - !Sub 'arn:aws:iam::${AWS::AccountId}:role/ecsTaskExecutionRole'
              - !Sub 'arn:aws:iam::${AWS::AccountId}:role/dme-searcher-task-role'
      Roles:
        - !Ref GitHubActionsECSDeployRole

  # =========================================================================
  # ECS Task Execution Role (Container pulls images, logs, secrets)
  # =========================================================================
  ECSTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ecsTaskExecutionRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: 'sts:AssumeRole'

  ECSTaskExecutionPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: ecs-task-execution-policy
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: ECRPullImages
            Effect: Allow
            Action:
              - ecr:GetAuthorizationToken
              - ecr:BatchGetImage
              - ecr:GetDownloadUrlForLayer
              - ecr:BatchCheckLayerAvailability
            Resource: '*'
          - Sid: CloudWatchLogs
            Effect: Allow
            Action:
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource:
              - !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/ecs/dme-searcher-*'
          - Sid: SecretsManagerRead
            Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
              - secretsmanager:DescribeSecret
            Resource:
              - !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:*/mongodb'
              - !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:dme-searcher/*'
      Roles:
        - !Ref ECSTaskExecutionRole

  # =========================================================================
  # ECS Task Application Role (Application permissions)
  # =========================================================================
  ECSTaskApplicationRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: dme-searcher-task-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: 'sts:AssumeRole'

  ECSTaskApplicationPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: dme-searcher-task-policy
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: S3ImageAccess
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:PutObject
              - s3:DeleteObject
              - s3:ListBucket
            Resource:
              - 'arn:aws:s3:::dme-user-image-4242/*'
              - 'arn:aws:s3:::dme-user-image-4242'
              - 'arn:aws:s3:::dme-web-image-4242/*'
              - 'arn:aws:s3:::dme-web-image-4242'
          - Sid: SecretsManagerRead
            Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
            Resource:
              - !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:*/mongodb'
              - !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:dme-searcher/*'
          - Sid: OpenSearchAccess
            Effect: Allow
            Action:
              - aoss:APIAccessAll
            Resource:
              - !Sub 'arn:aws:aoss:${AWS::Region}:${AWS::AccountId}:collection/*'
          - Sid: SageMakerInvoke
            Effect: Allow
            Action:
              - sagemaker:InvokeEndpoint
            Resource:
              - !Sub 'arn:aws:sagemaker:${AWS::Region}:${AWS::AccountId}:endpoint/defenderImageAnalyzer*'
          - Sid: KafkaAccess
            Effect: Allow
            Action:
              - kafka:GetBootstrapBrokers
              - kafka-cluster:Connect
              - kafka-cluster:AlterCluster
              - kafka-cluster:DescribeCluster
            Resource: '*'
          - Sid: CloudWatchLogs
            Effect: Allow
            Action:
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource:
              - !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/ecs/dme-searcher-*'
          - Sid: CloudWatchMetrics
            Effect: Allow
            Action:
              - cloudwatch:PutMetricData
            Resource: '*'
      Roles:
        - !Ref ECSTaskApplicationRole

Outputs:
  GitHubActionsECRRoleArn:
    Description: ARN of GitHub Actions ECR Role
    Value: !GetAtt GitHubActionsECRRole.Arn
    Export:
      Name: GitHubActionsECRRoleArn

  GitHubActionsECSDeployRoleArn:
    Description: ARN of GitHub Actions ECS Deploy Role
    Value: !GetAtt GitHubActionsECSDeployRole.Arn
    Export:
      Name: GitHubActionsECSDeployRoleArn

  ECSTaskExecutionRoleArn:
    Description: ARN of ECS Task Execution Role
    Value: !GetAtt ECSTaskExecutionRole.Arn
    Export:
      Name: ECSTaskExecutionRoleArn

  ECSTaskApplicationRoleArn:
    Description: ARN of ECS Task Application Role
    Value: !GetAtt ECSTaskApplicationRole.Arn
    Export:
      Name: ECSTaskApplicationRoleArn
